<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Account — MarketBridge</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-accent">Market</span>Bridge
            </a>
            <div class="nav-links">
                <a href="login.html">Sign In</a>
            </div>
        </div>
    </nav>

    <main class="auth-wrapper">
        <div class="auth-card">
            <h2>Get started with MarketBridge</h2>
            <p class="auth-subtitle">Build a verified digital reputation to unlock credit and growth.</p>

            <div id="alert-box" class="alert hidden"></div>

            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" placeholder="Mama Ngozi" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="name@example.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="+234 80 1234 5678" required autocomplete="tel">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="At least 6 characters" required autocomplete="new-password" minlength="6">
                </div>

                <button type="submit" id="btn-submit" class="btn btn-primary btn-large w-100">Create Account</button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Sign In</a></p>
            </div>
        </div>
    </main>

    <script type="module" src="js/register.js"></script>
</body>
</html>
